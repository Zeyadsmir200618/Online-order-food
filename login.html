<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Yalla Eat</title>
<link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Floating Circles -->
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

    <div class="auth-container">

        <!-- Logo / Brand -->
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-bowl-food"></i>
            </div>
            <h1>Yalla Eat</h1>
            <p class="subtitle">Welcome back! Sign in to continue 🍔</p>
        </div>

        <!-- Role Selector -->
        <div class="role-selector">
            <button class="role-btn active" data-role="customer">
                <i class="fa-solid fa-user"></i> Customer
            </button>
            <button class="role-btn" data-role="restaurant">
                <i class="fa-solid fa-store"></i> Restaurant
            </button>
            <button class="role-btn" data-role="driver">
                <i class="fa-solid fa-motorcycle"></i> Driver
            </button>
            <button class="role-btn" data-role="admin">
                <i class="fa-solid fa-shield-halved"></i> Admin
            </button>
        </div>

        <!-- Login Form -->
        <form class="auth-form" id="loginForm">

            <div class="input-group">
                <i class="fa-solid fa-envelope input-icon"></i>
                <input type="email" id="email" placeholder="Email address" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" id="password" placeholder="Password" required>
                <button type="button" class="toggle-password" id="togglePass">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember">
                    <span class="checkmark"></span>
                    Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </form>

        <div class="divider">
            <span>or</span>
        </div>

        <!-- Social Login -->
        <div class="social-login">
            <button class="social-btn google">
                <i class="fa-brands fa-google"></i> Continue with Google
            </button>
        </div>

        <p class="switch-auth">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </p>

    </div>

<script src="js/login.js"></script></body>
</html>
