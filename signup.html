<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Yalla Eat</title>
<link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Floating Circles -->
    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

    <div class="auth-container">

        <!-- Brand -->
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-bowl-food"></i>
            </div>
            <h1>Join Yalla Eat</h1>
            <p class="subtitle">Create your account and start ordering 🚀</p>
        </div>

        <!-- Role Selector -->
        <div class="role-selector">
            <button class="role-btn active" data-role="customer">
                <i class="fa-solid fa-user"></i> Customer
            </button>
            <button class="role-btn" data-role="restaurant">
                <i class="fa-solid fa-store"></i> Restaurant
            </button>
            <button class="role-btn" data-role="driver">
                <i class="fa-solid fa-motorcycle"></i> Driver
            </button>
        </div>

        <!-- Step Indicator -->
        <div class="steps">
            <div class="step active" id="step1-dot">
                <span>1</span>
            </div>
            <div class="step-line"></div>
            <div class="step" id="step2-dot">
                <span>2</span>
            </div>
        </div>
        <div class="step-labels">
            <span>Account Info</span>
            <span>Personal Details</span>
        </div>

        <!-- Step 1: Account Info -->
        <form class="auth-form" id="signupForm">

            <div class="form-step" id="formStep1">

                <div class="input-group">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="Email address" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Create a password" required>
                    <button type="button" class="toggle-password" id="togglePass">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-shield input-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                    <button type="button" class="toggle-password" id="toggleConfirm">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <!-- Password Strength -->
                <div class="strength-wrapper" id="strengthWrapper">
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                    <span class="strength-label" id="strengthLabel">Password strength</span>
                </div>

                <button type="button" class="submit-btn" id="nextBtn">
                    <span>Next Step</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </div>

            <!-- Step 2: Personal Details -->
            <div class="form-step hidden" id="formStep2">

                <div class="name-row">
                    <div class="input-group">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="firstName" placeholder="First name" required>
                    </div>
                    <div class="input-group">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="lastName" placeholder="Last name" required>
                    </div>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input type="tel" id="phone" placeholder="Phone number" required>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-location-dot input-icon"></i>
                    <input type="text" id="address" placeholder="Delivery address">
                </div>

                <!-- Extra field for Restaurant -->
                <div class="input-group restaurant-only hidden" id="restaurantNameGroup">
                    <i class="fa-solid fa-store input-icon"></i>
                    <input type="text" id="restaurantName" placeholder="Restaurant name">
                </div>

                <!-- Extra field for Driver -->
                <div class="input-group driver-only hidden" id="vehicleGroup">
                    <i class="fa-solid fa-motorcycle input-icon"></i>
                    <input type="text" id="vehicleInfo" placeholder="Vehicle info (e.g., motorcycle, car)">
                </div>

                <div class="terms-row">
                    <label class="remember-me">
                        <input type="checkbox" id="terms" required>
                        <span class="checkmark"></span>
                        I agree to the <a href="#" class="terms-link">Terms & Conditions</a>
                    </label>
                </div>

                <div class="btn-row">
                    <button type="button" class="back-btn" id="backBtn">
                        <i class="fa-solid fa-arrow-left"></i> Back
                    </button>
                    <button type="submit" class="submit-btn" id="submitBtn">
                        <span>Create Account</span>
                        <i class="fa-solid fa-check"></i>
                    </button>
                </div>

            </div>

        </form>

        <p class="switch-auth">
            Already have an account? <a href="login.html">Sign In</a>
        </p>

    </div>

    <script src="signup.js"></script>
</body>
</html>
